# Hourly reminder send. Not in vercel.json because Hobby caps Vercel Cron at
# once a day, which is too coarse for a 20-hour reminder lead.
# Needs a CRON_SECRET Actions secret matching the one set on Vercel.
name: Event reminders

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: event-reminders

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # `www`, not the apex. The apex 308-redirects here, and curl drops
          # the Authorization header across a redirect to a different host —
          # so the apex spelling reached the endpoint unauthenticated and got
          # a 401 on every scheduled run.
          SITE_URL: ${{ vars.SITE_URL || 'https://www.multimulk.com' }}
        run: |
          curl "$SITE_URL/api/cron/event-reminders" \
            --silent --show-error --fail-with-body --location \
            --retry 3 --retry-delay 10 \
            --header "Authorization: Bearer $CRON_SECRET"
